version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: vocafy_app
    working_dir: /var/www
    user: "${UID}:${GID}"
    volumes:
      - ./src:/var/www
    ports:
      - "5173:5173"
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: vocafy_nginx
    ports:
      - "8080:80"
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  queue:
    image: vocafy-app:latest
    container_name: vocafy_queue
    working_dir: /var/www
    user: "${UID}:${GID}"
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./src:/var/www
    depends_on:
      - db
      - app
    restart: unless-stopped

  ielts_queue:
    image: vocafy-app:latest
    container_name: vocafy_ielts_queue
    working_dir: /var/www
    user: "${UID}:${GID}"
    command: php artisan queue:work ielts --queue=ielts --tries=2 --timeout=660
    volumes:
      - ./src:/var/www
    depends_on:
      - db
      - app
    restart: unless-stopped

  scheduler:
    image: vocafy-app:latest
    container_name: vocafy_scheduler
    working_dir: /var/www
    user: "${UID}:${GID}"
    command: php artisan schedule:work
    volumes:
      - ./src:/var/www
    depends_on:
      - db
      - app
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: vocafy_db
    restart: always
    environment:
      MYSQL_DATABASE: vocafy
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: vocafy
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: